# nginx 站点配置（8.215.80.82:443，自签名 HTTPS）
# 部署到宝塔面板: /www/server/panel/vhost/nginx/yino-vapi-443.conf
# 或 nginx 默认: /etc/nginx/conf.d/yino-vapi.conf

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 8.215.80.82;

    ssl_certificate     /opt/yino-vapi/certs/fullchain.pem;
    ssl_certificate_key /opt/yino-vapi/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 200m;

    # 前端静态资源（SPA hash 路由，统一回退到 index.html）
    location / {
        root /opt/yino-vapi/frontend-dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 禁用旧 PWA Service Worker，避免手机缓存错误 API 地址
    location = /sw.js {
        root /opt/yino-vapi/frontend-dist;
        add_header Cache-Control "no-store";
        add_header Clear-Site-Data "\"cache\", \"storage\"";
        return 404;
    }
    location = /manifest.webmanifest {
        root /opt/yino-vapi/frontend-dist;
        add_header Cache-Control "no-cache";
    }

    # Platform API 反代
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # LiveKit WebSocket 信令反代
    # 浏览器通过 wss://8.215.80.82/livekit 连接；后端 LiveKit 根路径为 /
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /livekit {
        return 301 /livekit/;
    }

    access_log /www/wwwlogs/yino-vapi-443.log;
    error_log  /www/wwwlogs/yino-vapi-443.error.log;
}

# 注意：不要在此劫持 :80（宝塔上已有 /yinovapi/ 等站点）。
# 请直接访问 https://8.215.80.82

