[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yino-voice-agent"
version = "0.1.0"
description = "Local LiveKit AI voice customer service with Alibaba Fun-ASR"
requires-python = ">=3.11,<3.15"
dependencies = [
  "livekit-agents[openai,silero]>=1.6.1,<2",
  "aiohttp>=3.12,<4",
  "dashscope>=1.25,<2",
  "websocket-client>=1.8,<2",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/yino_voice_agent/customer_service.py" = ["RUF001"]
"src/yino_voice_agent/server.py" = ["RUF001"]
"tests/test_config.py" = ["RUF001"]
"tests/test_customer_service.py" = ["RUF001"]
"tests/test_server.py" = ["RUF001"]
"tests/sip_fakes.py" = ["RUF001"]
"tests/test_sip_e2e.py" = ["RUF001"]
