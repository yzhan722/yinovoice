name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yino
          POSTGRES_PASSWORD: yino
          POSTGRES_DB: yino_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yino -d yino_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: python -m pip install -e ".[dev]"
      # In-memory suite must run without DATABASE_URL: create_app() switches
      # to Postgres repositories whenever the variable is present.
      - name: Test API (in-memory repositories)
        run: python -m pytest -q
      - name: Test API (Alembic + Postgres repositories)
        env:
          DATABASE_URL: postgresql+asyncpg://yino:yino@localhost:5432/yino_platform
        run: python -m pytest -q tests/test_db_migrations.py tests/test_app_repository_wiring.py tests/test_postgres_*.py

  voice-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime/voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice-agent
        run: python -m pip install -e ".[dev]"
      - name: Test voice-agent
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install web
        run: pnpm install --frozen-lockfile
      - name: Test web
        run: pnpm test
      - name: Typecheck web
        run: pnpm typecheck
      - name: Build web
        run: pnpm build

  call-insights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/call-insights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Call Insights
        run: npm ci
      - name: Test Call Insights
        run: npm test
      - name: Typecheck Call Insights
        run: npm run typecheck

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ended-call fixtures
        run: python packages/contracts/ended-call/validate.py
