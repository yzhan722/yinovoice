name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: python -m pip install -e ".[dev]"
      - name: Test API
        run: python -m pytest -q

  voice-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime/voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice-agent
        run: python -m pip install -e ".[dev]"
      - name: Test voice-agent
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install web
        run: pnpm install --frozen-lockfile
      - name: Test web
        run: pnpm test
      - name: Typecheck web
        run: pnpm typecheck
      - name: Build web
        run: pnpm build

  call-insights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/call-insights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Call Insights
        run: npm ci
      - name: Test Call Insights
        run: npm test
      - name: Typecheck Call Insights
        run: npm run typecheck

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ended-call fixtures
        run: python packages/contracts/ended-call/validate.py
